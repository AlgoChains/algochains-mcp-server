version: 2
updates:
  # Python dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # mcp 2.x removed Server.list_tools/call_tool and renamed Tool.inputSchema;
      # migrating is deliberate work (see pyproject.toml) — never a resolver bump.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      python-dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"
          - "pip-audit*"
        update-types:
          - "minor"
          - "patch"

  # Node.js SDK (packages/sdk)
  - package-ecosystem: "npm"
    directory: "/packages/sdk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # Node.js CLI (src/cli)
  - package-ecosystem: "npm"
    directory: "/src/cli"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
